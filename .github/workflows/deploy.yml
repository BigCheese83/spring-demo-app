name: Deploy to Minikube

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Install Prometheus CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.90.1/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Build image
        run: |
          eval $(minikube docker-env)
          docker build -t spring-demo-app .

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy with Helm
        run: |
          helm upgrade --install my-app ./spring-boot-chart

      - name: Wait for Spring app to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=spring-app --timeout=120s

      - name: Debug - check pod logs
        run: |
          kubectl logs -l app=spring-app --tail=100

      - name: Test endpoint
        run: |
          kubectl port-forward service/spring-app 8080:8080 & sleep 30
          curl --retry 10 --retry-delay 3 --fail http://localhost:8080 | grep "Hello from Docker"